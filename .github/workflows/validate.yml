
name: CI - Build and Test RaceDay

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release

      - name: Test API
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release

      - name: Build MVC Project
        run: dotnet build RaceDayMVC/RaceDayMVC.csproj --configuration Release