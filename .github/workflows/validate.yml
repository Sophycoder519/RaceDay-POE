name: CI - Build and Test RaceDay

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release

      - name: Test API
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release

      # Note: If the MVC project needs .NET 9, we use the generic dotnet build 
      # but ensure the runner has it. Using setup-dotnet for both:
      - name: Setup .NET 9 for MVC
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build MVC Project
        run: dotnet build RaceDayMVC/RaceDayMVC.csproj --configuration Release