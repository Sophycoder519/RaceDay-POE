name: CI - Validate Part 1 Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Verify ERD file
        run: |
          if [ -f "docs/erd.pdf" ]; then
            echo "ERD file found"
          else
            echo "ERD (PDF) not found in docs"
            ls -la docs/
            exit 1
          fi

      - name: Verify Endpoint Plan
        run: |
          if [ -f "docs/endpoint-plan.md" ]; then
            echo "Endpoint Plan found"
          else
            echo "Endpoint Plan not found in docs"
            exit 1
          fi

      - name: Verify SQL Script
        run: |
          if [ -f "docs/script.sql" ]; then
            echo "SQL Script found"
          else
            echo "SQL Script not found in docs"
            exit 1
          fi

      - name: Final Success
        run: echo "All Part 1 documents are present"
