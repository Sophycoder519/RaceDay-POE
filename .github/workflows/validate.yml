name: CI - Build and Test RaceDay

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.sln

      - name: Build Solution
        run: dotnet build RaceDayAPI/RaceDayAPI.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test RaceDayAPI/RaceDayAPI.sln --configuration Release --no-build --verbosity normal