name: CI - Build and Test RaceDay
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj
      - name: Test API
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj
      - name: Build MVC
        run: dotnet build RaceDayMVC/RaceDayMVC.csproj
